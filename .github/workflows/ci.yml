name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_PUBLIC_KEY:
        required: true
      SUPABASE_SECRET_KEY:
        required: true
      GROQ_API_KEY:
        required: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3

      - name: Instalar dependencias
        run: uv sync

      - name: Ruff — linter
        run: uv run ruff check app

      - name: Mypy — tipos
        run: uv run mypy app

      - name: Pytest — tests
        run: uv run pytest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLIC_KEY: ${{ secrets.SUPABASE_PUBLIC_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MISTRAL_API_KEY: "api_for_test"

      - name: Docker — compilar imagen
        run: docker build -t visir-api .

  evals:
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3

      - name: Instalar dependencias
        run: uv sync

      - name: Descargar modelo de embeddings en Ollama
        run: |
          curl -s http://localhost:11434/api/pull -d '{"name": "embeddinggemma:latest"}'

      - name: Restaurar índice de ChromaDB (normativa SAT) desde caché
        id: cache-chroma
        uses: actions/cache@v4
        with:
          path: chroma_db
          key: chroma-normativa-${{ hashFiles('data/**/*.pdf', 'data/**/*.md') }}

      - name: Ingestar normativa SAT (solo si no hay caché)
        if: steps.cache-chroma.outputs.cache-hit != 'true'
        run: uv run python -m ingestion.run
        env:
          CHROMA_PATH: ./chroma_db
          EMBEDDING_BASE_URL: http://localhost:11434/v1

      - name: Gate — Recall@k del RAG normativo (V-05 / V-07)
        run: uv run python -m evaluaciones.ci_gate --umbral-recall-3 0.70
        env:
          CHROMA_PATH: ./chroma_db
          EMBEDDING_BASE_URL: http://localhost:11434/v1
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Gate — Precisión de enrutamiento (léxico)
        run: uv run python -m evaluaciones.eval_ruteo --modo lexico --umbral 0.80 --output validation_results/eval_ruteo_ci.json

      - name: Gate — Pipeline de confianza V-10 (baseline)
        run: uv run python -m evaluaciones.eval_confianza --modo baseline --umbral 0.80 --output validation_results/eval_confianza_baseline_ci.json

      - name: Gate — Pipeline de confianza V-10 (modelo real)
        run: uv run python -m evaluaciones.eval_confianza --modo modelo --umbral 0.70 --output validation_results/eval_confianza_modelo_ci.json
        continue-on-error: true
        env:
          MODELO_CONFIANZA_PATH: ./evaluaciones/modelos/modelo_confianza_ridge.pkl

      - name: Agregar métricas para dashboard
        if: always()
        run: uv run python -m evaluaciones.agregar_metricas

      - name: Generar dashboard HTML
        if: always()
        run: uv run python -m evaluaciones.generar_dashboard

      - name: Subir reportes de evaluación como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-evaluacion
          path: validation_results/